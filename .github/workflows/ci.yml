name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install --upgrade pip '.[dev]'
      - name: Test
        run: pytest
      - name: Public surface audit
        run: python scripts/audit_public_surface.py --json
      - name: Build distributions
        run: python -m build
      - name: Installed demo
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-policy-demo"
          "$RUNNER_TEMP/agent-policy-demo/bin/python" -m pip install --no-deps dist/*.whl >/dev/null
          set +e
          "$RUNNER_TEMP/agent-policy-demo/bin/agent-policy" dry-run --policy examples/policy.json --request examples/request.json --receipt
          code=$?
          set -e
          test "$code" -eq 1
